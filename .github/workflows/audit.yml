# =============================================================================
#  audit.yml : cherche les failles connues dans les bibliothèques Rust
# =============================================================================
#  "cargo audit" compare la liste de nos bibliothèques (Cargo.lock) avec la base
#  officielle des failles de sécurité de Rust (RustSec). Il tourne chaque lundi
#  et à chaque changement de Cargo.lock.
# =============================================================================
name: Security audit

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    paths:
      - "src-tauri/Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit des bibliothèques
        run: cargo audit --file src-tauri/Cargo.lock
