# =============================================================================
#  codeql.yml : analyse de SÉCURITÉ automatique du code (par GitHub)
# =============================================================================
#  CodeQL lit le code à la recherche de failles connues (injection, XSS...).
#  Il analyse le JavaScript de l'interface et les fichiers de workflows.
#  Les résultats apparaissent dans l'onglet Security > Code scanning.
#  (Ne pas activer EN PLUS la "configuration par défaut" de CodeQL dans les
#   réglages du dépôt : ce fichier la remplace.)
# =============================================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"   # chaque mardi matin

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
